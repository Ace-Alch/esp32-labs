name: Deploy ESP32 Labs to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: esp32-labs-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: agharsallah/esp-labs
          ref: 72f1fc1f5cb81a5fadb4ccc97b29bf5fc68fa30b
          path: upstream-firmware
          persist-credentials: false
      - name: Place firmware beside the guide
        run: mv upstream-firmware ../esp-labs
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Include license notices
        run: |
          cp LICENSE dist/LICENSE
          cp ../esp-labs/LICENSE dist/FIRMWARE-LICENSE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
